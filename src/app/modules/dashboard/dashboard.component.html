
<form [formGroup]="userForm" (ngSubmit)="guardar()" class="p-6 max-w-xl  bg-surface-0 dark:bg-surface-900 rounded-xl shadow-sm border border-secondary-200 dark:border-secondary-700 mt-8">
    
    <h2 class="text-xl font-bold mb-6 text-secondary-900 dark:text-white">Formulario de Prueba</h2>

    <div class="flex flex-col gap-4">
        
        <app-form-field label="Nombre Completo" [required]="true" [control]="userForm.get('nombre')">
            <input pInputText type="text" formControlName="nombre" placeholder="Ej: Juan Pérez" />
        </app-form-field>

        <app-form-field label="Correo Electrónico" [required]="true" [control]="userForm.get('email')">
            <input pInputText type="email" formControlName="email" placeholder="correo@ejemplo.com" />
        </app-form-field>

        <app-form-field label="Teléfono Celular" [control]="userForm.get('telefono')">
            <input pInputText type="tel" formControlName="telefono" placeholder="+51 999 999 999" />
        </app-form-field>

    </div>

    <div class="mt-6 flex justify-end">
        <p-button label="Guardar Datos" type="submit" [disabled]="userForm.invalid"></p-button>
    </div>

</form>

<div class="grid grid-cols-1 gap-4 my-4">
    <app-search-field (search)="buscarUsuario($event)"></app-search-field>

<app-search-field [showIcon]="false" [showButton]="true" buttonText="Ir"></app-search-field>

<app-search-field [showButton]="true" placeholder="Escribe el código de producto..."></app-search-field>
</div>

<div class="my-8">

<app-table 
    title="Catálogo de Productos"
    [data]="misDatos"
    [columns]="misColumnas"
    [globalFilterFields]="['nombre', 'codigo']"
    [showSelection]="true"
    (onEdit)="editar($event)"
    (onDelete)="eliminar($event)"
    (onSelectionChange)="seleccionMultiple($event)">
</app-table>
</div>
