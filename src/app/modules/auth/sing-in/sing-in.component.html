<div
    class="min-h-screen bg-transparent flex items-center justify-center p-4"
>
    <div
        class="w-full max-w-md bg-white dark:bg-dark-scale rounded-2xl shadow-xl border border-gray-scale-200 dark:border-gray-scale-800 p-8"
    >
        <!-- Logo / Header -->
        <div class="flex flex-col items-center mb-8">
            <div
                class="w-36 h-36 rounded-2xl flex items-center justify-center "
            >
                <img
                    class="w-full"
                    src="images/logo/logo.png"
                    alt="Logo image"
                />
            </div>
            <h1 class="text-3xl font-barlow font-bold text-dark-scale dark:text-white">Bienvenido</h1>
            <p class="text-md font-medium text-gray-scale-600 dark:text-gray-scale-300 mt-1">
                Inicia sesión para continuar
            </p>
        </div>

        <!-- Formulario -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
            <app-form-field
                formControlName="user"
                [config] = "{
                    type: 'text',
                    label: 'Usuario',
                    placeholder: 'Ingrese Usuario',
                    required: true,
                    inputTooltip: 'Ingresa tu usuario'
                }"   
            />
            <label for="">Contraseña</label>
            <p-password
                formControlName="password"
                placeholder="••••••••"
                [feedback]="false"
                [toggleMask]="true"
                styleClass="w-full"
                inputStyleClass="w-full text-xs"
                autocomplete="current-password"
            ></p-password>

            <div class="flex justify-end -mt-2">
                <a
                    href="#"
                    class="text-xs text-secondary hover:text-primary-600 dark:hover:text-primary-400 transition-colors"
                >
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
            <div class="w-full">
                <app-button
                    [config]="{ 
                        label: 'Ingresar', 
                        type: 'primary',
                        fullWidth: true
                    }"
                    (click)="onSubmit()"
                ></app-button>
            </div>
        </form>
    </div>
</div>
