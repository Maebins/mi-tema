<div class="w-full border-b border-gray-scale-200 dark:border-dark-scale-700">
    <nav class="-mb-px flex space-x-6 overflow-x-auto custom-scrollbar" aria-label="Tabs">
        @for (tab of items; track tab.id) {
            <button
                (click)="selectTab(tab.id, tab.disabled)"
                [disabled]="tab.disabled"
                class="group inline-flex items-center whitespace-nowrap border-b-2 border-x-0 border-t-0 px-1 py-4 text-sm font-bold outline-none transition-all duration-200 focus:outline-none focus:ring-0"
                [ngClass]="[
                    activeId === tab.id
                        ? 'border-b-secondary text-dark-scale-950 dark:text-white'
                        : 'border-b-transparent hover:text-gray-scale-700 dark:text-gray-scale-400 dark:hover:border-b-dark-scale-600 dark:hover:text-gray-scale-200',
                    tab.disabled 
                        ? 'cursor-not-allowed opacity-50' 
                        : 'cursor-pointer'
                ]"
            >
                @if (tab.icon) {
                    <i 
                        [class]="tab.icon" 
                        class="mr-2 text-lg transition-colors"
                        [ngClass]="activeId === tab.id ? 'text-dark-scale-950 dark:text-white' : 'text-gray-scale-400 group-hover:text-gray-scale-500 dark:text-gray-scale-500'"
                    ></i>
                }
                
                {{ tab.label }}
            </button>
        }
    </nav>
</div>
