<div
    class="bg-surface-0 dark:bg-surface-900 rounded-xl shadow-sm border border-secondary-200 dark:border-secondary-700 overflow-hidden"
>
    <p-table
        #dt
        [value]="data"
        [columns]="columns"
        [paginator]="paginator"
        [rows]="rows"
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        [globalFilterFields]="globalFilterFields"
        [selectionMode]="'multiple'"
        [(selection)]="selectedItems"
        (selectionChange)="onSelectionChange.emit(selectedItems)"
        styleClass="p-datatable-sm"
        [rowHover]="true"
    >
        <ng-template pTemplate="caption" *ngIf="showGlobalFilter">
            <div
                class="flex flex-col md:flex-row justify-between items-center gap-4 p-4 border-b border-secondary-200 dark:border-secondary-700"
            >
                <h3 class="text-lg font-bold text-secondary-900 dark:text-white">{{ title }}</h3>

                <div class="w-full md:w-72">
                    <app-search-field
                        placeholder="Buscar en la tabla..."
                        (valueChange)="dt.filterGlobal($event, 'contains')"
                    >
                    </app-search-field>
                </div>
            </div>
        </ng-template>

        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngIf="showSelection" style="width: 4rem" class="text-center">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>

                <th
                    *ngFor="let col of columns"
                    [pSortableColumn]="col.sortable ? col.field : undefined"
                    [style.width]="col.width"
                >
                    <div
                        class="flex items-center gap-2 font-bold text-xs text-secondary-700 dark:text-secondary-300"
                    >
                        {{ col.header }}
                        <p-sortIcon *ngIf="col.sortable" [field]="col.field"></p-sortIcon>
                    </div>
                </th>

                <th
                    *ngIf="showActions"
                    style="width: 8rem"
                    class="text-center font-bold text-xs text-secondary-700 dark:text-secondary-300"
                >
                    Acciones
                </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr class="text-secondary-700 text-xs dark:text-secondary-200 transition-colors">
                <td *ngIf="showSelection" class="text-center">
                    <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
                </td>

                <td *ngFor="let col of columns">
                    <span *ngIf="!col.type || col.type === 'text'">
                        {{ rowData[col.field] }}
                    </span>

                    <span
                        *ngIf="col.type === 'currency'"
                        class="font-medium text-primary-600 dark:text-primary-400"
                    >
                        {{ rowData[col.field] | currency: 'USD' }}
                    </span>

                    <span
                        *ngIf="col.type === 'boolean'"
                        class="px-2 py-1 rounded-full text-xs font-bold"
                        [ngClass]="
                            rowData[col.field]
                                ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400'
                                : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'
                        "
                    >
                        {{ rowData[col.field] ? 'Activo' : 'Inactivo' }}
                    </span>
                </td>

                <td *ngIf="showActions" class="text-center">
                    <div class="flex items-center justify-center gap-2">
                        <!-- Proyección de acciones personalizadas -->
                        <ng-container *ngIf="actionTemplate">
                            <ng-container
                                *ngTemplateOutlet="actionTemplate; context: { $implicit: rowData }"
                            ></ng-container>
                        </ng-container>

                        <!-- Fallback: Botones por defecto si no hay template personalizado -->
                        <ng-container *ngIf="!actionTemplate">
                            <p-button
                                icon="material-symbols-rounded edit"
                                severity="secondary"
                                [rounded]="true"
                                [text]="true"
                                (onClick)="onEdit.emit(rowData)"
                            ></p-button>

                            <p-button
                                icon="material-symbols-rounded delete"
                                severity="danger"
                                [rounded]="true"
                                [text]="true"
                                (onClick)="onDelete.emit(rowData)"
                            ></p-button>
                        </ng-container>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td
                    [attr.colspan]="
                        columns.length + (showActions ? 1 : 0) + (showSelection ? 1 : 0)
                    "
                    class="text-center py-8"
                >
                    <div
                        class="flex flex-col items-center text-secondary-500 dark:text-secondary-400"
                    >
                        <span class="material-symbols-rounded text-5xl mb-2 opacity-50">inbox</span>
                        <p>No se encontraron registros.</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
