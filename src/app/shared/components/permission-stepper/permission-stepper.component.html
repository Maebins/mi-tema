<div class="flex flex-col items-start gap-2 py-4 sm:flex-row sm:gap-6">
    <div class="w-full pt-1 text-left text-sm font-bold text-gray-scale-600 sm:w-1/4 sm:text-right dark:text-gray-scale-300">
        {{ label }}
    </div>

    <div class="w-full px-2 sm:w-3/4">
        <p-slider
            [(ngModel)]="val"
            [min]="0"
            [max]="options.length - 1"
            [step]="1"
            [disabled]="isDisabled"
            (onChange)="onSliderChange($event)"
            styleClass="w-full"
        ></p-slider>

        <div class="mt-3 flex w-full justify-between">
            @for (opt of options; track opt.value) {
                <div
                    class="cursor-pointer select-none text-center transition-colors duration-200"
                    [ngClass]="getTextClasses(opt.value)"
                    (click)="onLabelClick(opt.value)"
                    [style.width]="labelWidth"
                >
                    <span class="text-xs">{{ opt.label }}</span>
                </div>
            }
        </div>
    </div>
</div>
