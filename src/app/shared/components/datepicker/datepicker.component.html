<p-datepicker
    [(ngModel)]="value"
    (ngModelChange)="onDateChange($event)"
    (onBlur)="onBlur()"
    [placeholder]="placeholder"
    [dateFormat]="dateFormat"
    [showIcon]="showIcon"
    [selectionMode]="selectionMode"
    [disabled]="disabled"
    [minDate]="minDate"
    [maxDate]="maxDate"
    styleClass="w-full"
    inputStyleClass="w-full text-xs"
    panelStyleClass="text-xs"
    class="w-full flex text-xs"
    [fluid]="true"
></p-datepicker>
