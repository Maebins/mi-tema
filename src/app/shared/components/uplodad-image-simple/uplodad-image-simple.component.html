<input
    #galleryInput
    type="file"
    (change)="onFileSelected($event)"
    class="hidden"
    accept="image/*"
/>
<input
    #cameraInput
    type="file"
    (change)="onFileSelected($event)"
    class="hidden"
    accept="image/*"
    capture="camera"
/>

@if (mostrarMenu) {
    <div class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm transition-opacity">
        
        <div class="w-full max-w-[320px] rounded-2xl bg-white p-6 shadow-2xl dark:border dark:border-dark-scale-700 dark:bg-dark-scale-800">
            
            <div class="mb-5 flex items-center justify-between">
                <h3 class="text-lg font-bold text-dark-scale dark:text-white">Seleccionar origen</h3>
                <button 
                    (click)="mostrarMenu = false" 
                    class="flex h-8 w-8 items-center justify-center rounded-full text-gray-scale-400 transition-colors hover:bg-gray-100 hover:text-dark-scale dark:hover:bg-dark-scale-700 dark:hover:text-white"
                >
                    <i class="pi pi-times"></i>
                </button>
            </div>

            <div class="flex flex-col gap-3">
                <button 
                    (click)="seleccionarOpcion('camara')"
                    class="flex w-full items-center justify-start gap-3 rounded-xl bg-primary px-4 py-3 text-sm font-bold text-white transition-colors hover:bg-primary/90 dark:bg-secondary dark:text-dark-scale dark:hover:bg-yellow-500"
                >
                    <i class="pi pi-camera text-lg"></i>
                    Tomar Foto
                </button>

                <button 
                    (click)="seleccionarOpcion('galeria')"
                    class="flex w-full items-center justify-start gap-3 rounded-xl border-2 border-primary bg-transparent px-4 py-3 text-sm font-bold text-primary transition-colors hover:bg-primary/5 dark:border-secondary dark:text-secondary dark:hover:bg-secondary/10"
                >
                    <i class="pi pi-images text-lg"></i>
                    Galería de Imágenes
                </button>
            </div>
        </div>
    </div>
}
