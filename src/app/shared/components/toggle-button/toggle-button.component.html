<label 
    class="inline-flex cursor-pointer items-center transition-opacity"
    [class.opacity-50]="isDisabled()"
    [class.cursor-not-allowed]="isDisabled()"
>
    <div class="mr-3 select-none text-right">
        @if (!state() && labelFalse) {
            <span class="text-sm font-bold text-gray-scale-600 dark:text-gray-scale-400">
                {{ labelFalse }}
            </span>
        }
        @if (state() && labelTrue) {
            <span class="text-sm font-bold text-dark-scale dark:text-white-scale">
                {{ labelTrue }}
            </span>
        }
    </div>

    <div class="relative flex items-center">
        <input
            type="checkbox"
            class="peer sr-only focus:outline-none focus:ring-0"
            [checked]="state()"
            [disabled]="isDisabled()"
            (change)="onToggle($event)"
        />
        
        <div
            class="h-5 w-10 rounded-full bg-gray-scale-300 transition-all duration-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-offset-1 dark:bg-dark-scale-700 dark:peer-focus:ring-offset-dark-scale-900"
            [ngClass]="[trackColorClass, focusRingClass]"
        ></div>
        
        <div
            class="absolute left-[2px] top-[2px] h-4 w-4 rounded-full bg-white shadow-sm transition-all duration-300 peer-checked:translate-x-5 dark:bg-gray-scale-100"
        ></div>
    </div>
</label>
