<button
    [type]="config.nativeType || 'button'"
    [disabled]="config.disabled || config.loading"
    [ngClass]="computedClasses"
    [appVoiceGuide]="config.voice || ''"
    [attr.aria-label]="config.label || config.iconName || 'Botón de acción'"
    class="group flex items-center justify-center font-bold transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed outline-none focus:outline-none focus:ring-0"
>

    @if (config.loading) {
        <svg class="animate-spin mr-2 h-5 w-5 text-current flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    } 
    
    @else if (config.icon) {
        <span 
            class="material-symbols-rounded text-[20px] leading-none flex-shrink-0" 
            [ngClass]="{ 'md:mr-2': config.label }"
        >
            {{ config.iconName || 'add' }}
        </span>
    }

    @if (config.label) {
        <span class="leading-none mt-[2px]" [ngClass]="{ 'hidden md:inline-block': config.icon }">
            {{ config.label }}
        </span>
    }
</button>
