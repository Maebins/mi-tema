<div 
    class="flex flex-col overflow-hidden rounded-xl border border-gray-scale-200 bg-white shadow-sm transition-all dark:border-gray-scale-900 dark:bg-dark-scale border-t-4"
    [ngClass]="accentClasses.borderTop"
>
    <div class="border-b border-gray-scale-100 px-6 py-4 dark:border-dark-scale-700/50">
        <h3 
            class="text-sm font-bold uppercase tracking-wider" 
            [ngClass]="accentClasses.title"
        >
            {{ config.title }}
        </h3>
    </div>

    <div class="flex flex-col px-6 py-4">
        <div class="flex flex-col divide-y divide-gray-scale-100 dark:divide-dark-scale-700/50">
            @for (row of config.rows; track row.label) {
                <div class="flex items-center justify-between py-2.5 first:pt-0 last:pb-0">
                    
                    <span class="text-xs font-medium text-gray-scale-500 dark:text-gray-scale-400">
                        {{ row.label }}
                    </span>
                    
                    <span
                        class="text-sm text-dark-scale dark:text-white-scale"
                        [ngClass]="[
                            row.bold ? 'font-bold' : 'font-semibold',
                            row.color ? row.color : ''
                        ]"
                    >
                        {{ row.value }}
                    </span>
                </div>
            }
        </div>
    </div>
</div>
