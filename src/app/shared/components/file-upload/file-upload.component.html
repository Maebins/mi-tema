<div class="w-full">
    <label
        *ngIf="label"
        class="mb-2 block text-sm font-bold text-gray-scale-700 dark:text-gray-scale-200"
    >
        {{ label }}
        <span class="ml-1 text-xs font-normal text-gray-scale-500"
            >(Máx {{ maxSizeMB }}MB)</span
        >
    </label>

    <div
        class="relative flex min-h-[160px] w-full flex-col items-center justify-center rounded-2xl border-2 transition-all duration-300 shadow-sm hover:shadow-md group"
        [ngClass]="{
            'opacity-50 cursor-not-allowed': isDisabled,
            
            'border-dashed bg-white dark:bg-dark-scale-900': files().length === 0,
         
            'border-gray-scale-400 hover:border-primary dark:border-gray-scale-600 dark:hover:border-secondary': (files().length === 0 && !isDisabled),

            'border-solid bg-gray-50 dark:bg-dark-scale-800 border-gray-scale-200 dark:border-dark-scale-700': files().length > 0
        }"
    >
        <input
            type="file"
            [accept]="allowedTypes"
            [multiple]="multiple"
            (change)="onFileSelected($event)"
            [disabled]="isDisabled"
            class="absolute inset-0 z-10 h-full w-full cursor-pointer opacity-0"
            [class.cursor-not-allowed]="isDisabled"
        />

        <div
            *ngIf="files().length === 0"
            class="pointer-events-none flex flex-col items-center justify-center p-6 text-center"
        >
            <div 
                class="mb-5 flex h-20 w-20 items-center justify-center rounded-full transition-all duration-300 group-hover:scale-110"
                [ngClass]="{
                    'bg-primary/10 dark:bg-secondary/20': !isDisabled,
                    'bg-gray-scale-200 dark:bg-dark-scale-700': isDisabled
                }"
            >
                <i 
                    class="pi pi-cloud-upload text-4xl transition-colors duration-300"
                    [ngClass]="{
                        'text-primary group-hover:text-primary-700 dark:text-secondary dark:group-hover:text-yellow-400': !isDisabled,
                        'text-gray-scale-500 dark:text-gray-scale-500': isDisabled
                    }"
                ></i>
            </div>

            <p class="text-sm font-medium text-gray-scale-600 dark:text-gray-scale-100">
                <span class="font-bold text-primary dark:text-secondary">Haz click para subir</span>
                o arrastra aquí
            </p>
            <p class="mt-2 text-xs uppercase tracking-wider text-gray-scale-500 dark:text-gray-scale-400">
                Formatos: {{ allowedTypes.replaceAll('.', ' ') }}
            </p>
        </div>

        <div *ngIf="files().length > 0" class="z-20 w-full space-y-3 p-4">
            <div
                *ngFor="let file of files(); let i = index"
                class="group/file relative flex items-center rounded-xl border border-gray-scale-200 bg-white p-3 shadow-sm transition-all duration-200 hover:border-primary/30 dark:border-dark-scale-600 dark:bg-dark-scale-800 dark:hover:border-secondary/30"
            >
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-gray-50 dark:bg-dark-scale-700">
                    <i class="pi text-xl" [ngClass]="getFileIcon(file)"></i>
                </div>

                <div class="ml-3 min-w-0 flex-1">
                    <p class="truncate text-sm font-semibold text-dark-scale dark:text-white-scale">
                        {{ getFileName(file) }}
                    </p>
                    <p class="text-xs text-gray-scale-500">
                        {{ getFileSize(file) }}
                    </p>
                </div>

                <button
                    type="button"
                    (click)="removeFile(i)"
                    [disabled]="isDisabled"
                    pTooltip="Quitar archivo"
                    tooltipPosition="left"
                    class="ml-2 flex h-8 w-8 items-center justify-center rounded-md text-gray-scale-400 transition-colors hover:bg-red-50 hover:text-red-custom focus:outline-none disabled:opacity-50 dark:hover:bg-red-custom/20 dark:hover:text-red-400"
                >
                    <i class="pi pi-times"></i>
                </button>
            </div>
        </div>
    </div>

    <div
        *ngIf="errorMessage()"
        class="mt-2 flex animate-pulse items-center px-1 text-xs font-medium text-primary dark:text-red-400"
    >
        <i class="pi pi-exclamation-circle mr-1"></i>
        {{ errorMessage() }}
    </div>
</div>
