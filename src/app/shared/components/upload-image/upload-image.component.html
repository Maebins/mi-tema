<div class="w-full overflow-hidden rounded-xl border border-gray-scale-200 bg-white shadow-sm dark:border-dark-scale-700 dark:bg-dark-scale-900">
    
    <div class="flex items-center gap-3 border-b border-gray-scale-200 bg-gray-50 p-3 dark:border-dark-scale-700 dark:bg-dark-scale-800">
        <input
            #fileInput
            type="file"
            (change)="fileChangeEvent($event)"
            class="hidden"
            multiple
        />
        
        <button
            class="flex items-center rounded-lg bg-primary px-4 py-2 text-sm font-bold text-white transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-secondary dark:text-dark-scale dark:hover:bg-yellow-500 dark:disabled:bg-dark-scale-700 dark:disabled:text-gray-scale-500"
            [disabled]="isFull()"
            (click)="fileInput.click()"
        >
            <i class="pi pi-camera mr-2 text-lg"></i>
            {{ isFull() ? 'Límite alcanzado' : 'Subir Imagen' }}
        </button>

        <span class="ml-auto text-xs font-semibold text-gray-scale-500 dark:text-gray-scale-400" *ngIf="images().length > 0">
            {{ images().length }} archivo(s)
        </span>
    </div>

    <div class="flex flex-col divide-y divide-gray-scale-100 dark:divide-dark-scale-700/50">
        <div
            *ngFor="let img of images(); let i = index"
            class="flex items-center gap-4 p-4 transition-colors hover:bg-gray-50 dark:hover:bg-dark-scale-800/50"
        >
            <div class="relative h-16 w-16 shrink-0 overflow-hidden rounded-lg border border-gray-scale-200 bg-gray-100 dark:border-dark-scale-600 dark:bg-dark-scale-800">
                <img [src]="img.previewUrl" class="h-full w-full object-cover" />
            </div>

            <div class="flex min-w-0 flex-1 flex-col justify-center">
                <span class="truncate text-sm font-bold text-dark-scale dark:text-white">
                    {{ img.type === 'NEW' ? img.finalFile?.name : 'Imagen Guardada' }}
                </span>

                <span class="mt-1 text-xs text-gray-scale-500 dark:text-gray-scale-400" *ngIf="img.type === 'NEW'">
                    {{ formatBytes(img.finalFile?.size) }}
                </span>
                <span class="mt-1 text-xs text-gray-scale-500 dark:text-gray-scale-400" *ngIf="img.type === 'EXISTING'">
                    En servidor
                </span>
            </div>

            <div
                class="mr-4 hidden rounded-lg px-2.5 py-1 text-xs font-bold tracking-wide sm:block"
                [ngClass]="img.type === 'NEW' ? 'bg-green-50 text-green-700 dark:bg-green-500/10 dark:text-green-400' : 'bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400'"
            >
                {{ img.type === 'NEW' ? 'Nuevo' : 'Guardado' }}
            </div>

            <div class="flex items-center gap-1">
                <button
                    *ngIf="img.type === 'NEW'"
                    (click)="editImage(i)"
                    matTooltip="Recortar"
                    class="flex h-8 w-8 items-center justify-center rounded-full text-green-custom transition-colors hover:bg-green-50 dark:text-green-500 dark:hover:bg-green-500/20"
                >
                    <i class="pi pi-pencil text-[15px]"></i>
                </button>

                <button
                    (click)="removeImage(i)"
                    matTooltip="Quitar"
                    class="flex h-8 w-8 items-center justify-center rounded-full text-red-custom transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-500/20"
                >
                    <i class="pi pi-trash text-[15px]"></i>
                </button>
            </div>
        </div>

        <div *ngIf="images().length === 0" class="flex flex-col items-center justify-center p-12 text-center">
            <i class="pi pi-cloud-upload mb-4 text-5xl text-gray-scale-300 dark:text-dark-scale-600"></i>
            <p class="text-sm font-bold text-gray-scale-500 dark:text-gray-scale-300">
                No hay imágenes seleccionadas
            </p>
            <p class="mt-1 text-xs text-gray-scale-400 dark:text-gray-scale-500">
                Toca el botón superior para agregar
            </p>
        </div>
    </div>
</div>
