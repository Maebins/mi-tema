<div class="relative flex items-center w-full transition-all duration-300">
    <span
        *ngIf="showIcon"
        class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-secondary-400"
    >
        {{ iconName }}
    </span>

    <input
        type="text"
        [placeholder]="placeholder"
        [value]="value"
        (input)="onInputChange($event)"
        (keyup.enter)="onSearch()"
        class="w-full h-10 rounded-full border border-secondary-200 dark:border-secondary-700 bg-surface-0 dark:bg-surface-900 text-secondary-900 dark:text-secondary-100 focus:ring-2 focus:ring-primary-500 focus:outline-none transition-colors"
        [ngClass]="{
            'pl-10': showIcon,
            'pl-4': !showIcon,
            'pr-24': showButton,
            'pr-4': !showButton,
        }"
    />

    <button
        *ngIf="showButton"
        (click)="onSearch()"
        class="absolute right-1 top-1/2 -translate-y-1/2 h-8 px-4 bg-primary-500 hover:bg-primary-600 text-white text-xs font-medium rounded-full transition-colors"
    >
        {{ buttonText }}
    </button>
</div>
