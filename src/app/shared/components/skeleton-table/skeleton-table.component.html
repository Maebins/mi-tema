<div
    class="bg-surface-0 dark:bg-surface-900 rounded-xl shadow-sm border border-secondary-200 dark:border-secondary-700 overflow-hidden"
>
    <div
        class="p-6 flex items-center justify-between border-b border-secondary-200 dark:border-secondary-700"
    >
        <p-skeleton width="150px" height="2rem"></p-skeleton>
        <p-skeleton width="200px" height="2.5rem" borderRadius="8px"></p-skeleton>
    </div>
    <p-table [value]="rowsArray">
        <ng-template pTemplate="header">
            <tr>
                @for (col of colsArray; track $index) {
                    <th><p-skeleton width="100%"></p-skeleton></th>
                }
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData>
            <tr>
                @for (col of colsArray; track $index) {
                    <td><p-skeleton width="100%"></p-skeleton></td>
                }
            </tr>
        </ng-template>
    </p-table>
</div>
