<button
    (click)="themeService.toggleTheme()"
    class="w-10 h-10 flex items-center justify-center text-gray-scale dark:text-gray-scale-200 hover:text-dark-scale dark:hover:text-white-scale hover:bg-gray-scale-50 dark:hover:bg-gray-scale-800 focus:outline-none focus:ring-2 focus:ring-transparent rounded-full transition-colors"
>
    <span class="material-symbols-rounded text-2xl">
        {{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}
    </span>
</button>
