<div *ngIf="item.title" class="px-4 py-2 text-xs font-semibold text-secondary-500 uppercase tracking-wider group-hover:opacity-100 transition-opacity duration-200"
    [ngClass]="{'md:opacity-0': layoutService.isMiniMode()}">
    {{ item.label }}
</div>

<div *ngIf="item.separator" class="border-t border-secondary-200 dark:border-secondary-700 my-2"></div>

<ng-container *ngIf="!item.title && !item.separator">
    
    <a *ngIf="!item.children; else parentItem"
        [routerLink]="item.routerLink"
        routerLinkActive="bg-primary-50 text-primary-600 font-medium dark:bg-primary-900/20"
        class="flex items-center px-4 py-2.5 mx-2 rounded-lg text-secondary-700 dark:text-secondary-200 hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors duration-150 cursor-pointer group"
        (click)="layoutService.closeMobileSidebar()">
    
    <span *ngIf="item.icon" class="material-symbols-rounded text-2xl"
            [ngClass]="{'mr-3': !layoutService.isMiniMode(), 'group-hover:mr-3 transition-all duration-200': layoutService.isMiniMode()}">
        {{ item.icon }}
    </span>
    
    <span class="flex-1 truncate transition-opacity duration-200"
            [ngClass]="{'md:opacity-0': layoutService.isMiniMode(), 'group-hover:opacity-100': layoutService.isMiniMode()}">
        {{ item.label }}
    </span>
    </a>

    <ng-template #parentItem>
    <div class="mx-2">
        <button (click)="item.expanded = !item.expanded"
                class="w-full flex items-center px-4 py-2.5 rounded-lg text-secondary-700 dark:text-secondary-200 hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors duration-150 group">
            
            <span *ngIf="item.icon" class="material-symbols-rounded text-2xl"
                    [ngClass]="{'mr-3': !layoutService.isMiniMode(), 'group-hover:mr-3 transition-all duration-200': layoutService.isMiniMode()}">
                {{ item.icon }}
            </span>
            
            <span class="flex-1 text-left truncate transition-opacity duration-200"
                    [ngClass]="{'md:opacity-0': layoutService.isMiniMode(), 'group-hover:opacity-100': layoutService.isMiniMode()}">
                {{ item.label }}
            </span>

            <span class="material-symbols-rounded text-xl transition-transform duration-200"
                    [ngClass]="{'rotate-180': item.expanded, 'md:opacity-0': layoutService.isMiniMode(), 'group-hover:opacity-100': layoutService.isMiniMode()}">
                expand_more
            </span>
        </button>

        <div *ngIf="item.expanded" 
                class="pl-4 mt-1 space-y-1 transition-all duration-200 overflow-hidden"
                [ngClass]="{'md:max-h-0': layoutService.isMiniMode(), 'group-hover:max-h-screen': layoutService.isMiniMode()}">
            <app-sidebar-item *ngFor="let child of item.children" [item]="child"></app-sidebar-item>
        </div>
    </div>
    </ng-template>

</ng-container>
