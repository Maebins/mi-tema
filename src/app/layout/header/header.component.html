<header
    class="h-16 bg-white dark:bg-secondary-900 border-b border-secondary-200 dark:border-secondary-700 flex items-center px-4 sticky top-0 z-30 transition-all duration-300"
>
    <button
        (click)="toggleSidebar()"
        class="w-10 h-10 flex items-center justify-center text-secondary-600 dark:text-secondary-300 rounded-full hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors"
    >
        <span class="material-symbols-rounded text-2xl">menu</span>
    </button>

    <div class="flex-1 px-4">
        <div class="relative">
            <span
                class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-secondary-400"
                >search</span
            >
            <input
                type="text"
                placeholder="Search..."
                class="w-full h-10 pl-10 pr-4 rounded-full border border-secondary-200 dark:border-secondary-700 bg-secondary-50 dark:bg-secondary-950 text-secondary-900 dark:text-secondary-100 focus:ring-2 focus:ring-primary-500 focus:outline-none transition-colors"
            />
        </div>
    </div>

    <div class="flex items-center space-x-1 ml-auto">
        <button
            class="w-10 h-10 flex items-center justify-center text-secondary-500 dark:text-secondary-400 rounded-full hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors"
        >
            <span class="material-symbols-rounded">language</span>
        </button>
        <button
            class="w-10 h-10 flex items-center justify-center text-secondary-500 dark:text-secondary-400 rounded-full hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors"
        >
            <span class="material-symbols-rounded">rule</span>
        </button>
        <button
            class="w-10 h-10 flex items-center justify-center text-secondary-500 dark:text-secondary-400 rounded-full hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors"
        >
            <span class="material-symbols-rounded">grid_view</span>
        </button>

        <button
            (click)="themeService.toggleTheme()"
            class="w-10 h-10 flex items-center justify-center text-secondary-500 dark:text-secondary-400 rounded-full hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors"
        >
            <span class="material-symbols-rounded text-2xl">
                {{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}
            </span>
        </button>

        <button
            class="relative w-10 h-10 flex items-center justify-center text-secondary-500 dark:text-secondary-400 rounded-full hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors"
        >
            <span class="material-symbols-rounded">notifications</span>
            <span
                class="absolute top-0 right-0 h-5 w-5 bg-primary-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white dark:border-secondary-900"
                >5</span
            >
        </button>

        <button
            class="relative w-10 h-10 flex items-center justify-center text-secondary-500 dark:text-secondary-400 rounded-full hover:bg-secondary-100 dark:hover:bg-secondary-800 transition-colors"
        >
            <span class="material-symbols-rounded">shopping_cart</span>
            <span
                class="absolute top-0 right-0 h-5 w-5 bg-primary-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white dark:border-secondary-900"
                >8</span
            >
        </button>

        <div
            class="flex items-center pl-3 border-l border-secondary-200 dark:border-secondary-700 ml-2"
        >
            <div
                class="h-9 w-9 rounded-full bg-secondary-200 dark:bg-secondary-700 border-2 border-secondary-200 dark:border-secondary-600 overflow-hidden flex items-center justify-center"
            >
                <span class="material-symbols-rounded text-secondary-500 dark:text-secondary-400"
                    >person</span
                >
            </div>
        </div>
    </div>
</header>
